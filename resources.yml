# CloudFormation resources: SQS queues (main + DLQ) and DynamoDB table.
# Referenced from serverless.yml via: resources: Resources: ${file(resource.yml):Resources}

Resources:
  ChatEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-chat-events-dlq-${sls:stage}

  ChatEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-chat-events-${sls:stage}
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChatEventsDLQ.Arn
        maxReceiveCount: 5

  ExpiredSessionsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-expired-sessions-dlq-${sls:stage}

  ExpiredSessionsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-expired-sessions-${sls:stage}
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExpiredSessionsDLQ.Arn
        maxReceiveCount: 5

  NotifyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-notify-dlq-${sls:stage}

  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-notify-${sls:stage}
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotifyDLQ.Arn
        maxReceiveCount: 5

  ChatSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:service}-chat-sessions-${sls:stage}
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: scheduledEndAt
          AttributeType: N
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusScheduledEndAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: scheduledEndAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn:
      - ApiGatewayCloudWatchRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn
