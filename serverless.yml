# "service" is the name of this project. This will also be added to your AWS resource names.
service: vf-endchat

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  package:
    individually: true
  apiGateway:
    apiKeys:
      - name: ${self:service}-api-key-${sls:stage}
        value: ${env:API_KEY}
    usagePlan:
      throttle:
        burstLimit: 200
        rateLimit: 100
  iam:
    role:
      statements:
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt ChatEventsQueue.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt ExpiredSessionsQueue.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt NotifyQueue.Arn
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource: !GetAtt ChatSessionsTable.Arn
        - Effect: Allow
          Action: dynamodb:Query
          Resource:
            - !GetAtt ChatSessionsTable.Arn
            - !Sub "${ChatSessionsTable.Arn}/index/StatusScheduledEndAtIndex"

functions:
  submitChatEvent:
    name: ${self:service}-submit-chat-event-${sls:stage}
    description: Receives chat events via HTTP POST /chat and enqueues them to SQS for processing.
    reservedConcurrency: 3
    handler: src/functions/submit-chat-event.handler
    events:
      - http:
          path: /chat
          method: post
          private: true
    environment:
      CHAT_EVENTS_QUEUE_URL: !Ref ChatEventsQueue

  processChatEvent:
    name: ${self:service}-process-chat-event-${sls:stage}
    description: Consumes chat events from SQS and updates chat session state in DynamoDB (auto-end logic).
    reservedConcurrency: 10
    handler: src/functions/process-chat-event.handler
    events:
      - sqs:
          arn: !GetAtt ChatEventsQueue.Arn
          batchSize: 10
    environment:
      CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable

  determineSession:
    name: ${self:service}-determine-session-${sls:stage}
    description: Runs every 2 minutes; queries DynamoDB for expired sessions and sends them to ExpiredSessionsQueue.
    handler: src/functions/determine-session.handler
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(2 minutes)
          enabled: true
    environment:
      CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable
      EXPIRED_SESSIONS_QUEUE_URL: !Ref ExpiredSessionsQueue

  markSessionsInactive:
    name: ${self:service}-mark-sessions-inactive-${sls:stage}
    description: Consumes expired session records from SQS and marks them inactive in DynamoDB; forwards to NotifyQueue.
    handler: src/functions/mark-sessions-inactive.handler
    events:
      - sqs:
          arn: !GetAtt ExpiredSessionsQueue.Arn
          batchSize: 10
    environment:
      CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable
      NOTIFY_QUEUE_URL: !Ref NotifyQueue

  notifyExternalService:
    name: ${self:service}-notify-external-service-${sls:stage}
    description: Consumes from NotifyQueue and calls external notification API.
    handler: src/functions/notify-external-service.handler
    events:
      - sqs:
          arn: !GetAtt NotifyQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
    environment:
      EXTERNAL_SERVICE_URL: ${env:EXTERNAL_SERVICE_URL, ''}

build:
  esbuild:
    bundle: true
    minify: true
    target: node20
    sourcemap: false

resources:
  Resources: ${file(resources.yml):Resources}
